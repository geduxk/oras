<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oras – Gudžiūnai</title>
<style>
html,body{margin:0;background:transparent;font:600 13px/1.25 system-ui,Segoe UI,Roboto,sans-serif;color:#0f172a;overflow:hidden}
.w{display:flex;align-items:center;gap:10px;padding:6px}
.ic{width:56px;height:56px;flex:none}
.ic svg{width:100%;height:100%;overflow:visible}
.t{font-size:14px}
.s{font-weight:500;color:#64748b;font-size:12px}
.h{display:flex;gap:8px;margin-top:4px}
.h div{text-align:center;font-size:11px;color:#475569;font-weight:600}
.h svg{width:24px;height:24px;display:block;margin:0 auto}
body.icon .txt{display:none}
body.icon .w{padding:0;justify-content:center}
body.icon .ic{width:100vmin;height:100vmin}
body.info .ic{display:none}
body.info .w{padding:2px 6px}
body.info .txt{display:flex;align-items:center;gap:12px;width:100%}
body.info .h{margin:0 0 0 auto}
body.info .t{font-size:16px}
body.info .s{font-size:13px}
body.info .h div{font-size:12px}
body.info .h svg{width:26px;height:26px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes fall{from{transform:translateY(-3px);opacity:0}30%{opacity:1}to{transform:translateY(5px);opacity:0}}
@keyframes flash{0%,80%,100%{opacity:1}85%{opacity:.2}90%{opacity:1}95%{opacity:.3}}
.rays{transform-origin:32px 32px;animation:spin 30s linear infinite}
.cl{animation:drift 4s ease-in-out infinite alternate}
.dr{animation:fall 1.1s linear infinite}
.dr:nth-child(2){animation-delay:.35s}.dr:nth-child(3){animation-delay:.7s}
.bolt{animation:flash 3s infinite}
</style>
</head>
<body>
<div class="w">
  <div class="ic" id="ic"></div>
  <div class="txt">
    <div><div class="t" id="t">Kraunama…</div>
    <div class="s" id="s"></div></div>
    <div class="h" id="h"></div>
  </div>
</div>
<script>
const LAT=55.508496, LON=23.773687;
const Q=new URLSearchParams(location.search);if(Q.has('icon'))document.body.classList.add('icon');if(Q.has('info'))document.body.classList.add('info');

const TXT={0:'Giedra',1:'Mažai debesuota',2:'Debesuota su pragiedruliais',3:'Apsiniaukę',45:'Rūkas',48:'Rūkas su šerkšnu',
51:'Silpna dulksna',53:'Dulksna',55:'Smarki dulksna',56:'Lijundra',57:'Smarki lijundra',
61:'Silpnas lietus',63:'Lietus',65:'Smarkus lietus',66:'Lijundra',67:'Smarki lijundra',
71:'Silpnas sniegas',73:'Sninga',75:'Smarkus sniegas',77:'Sniego kruopos',
80:'Trumpas lietus',81:'Lietus su pertraukomis',82:'Liūtis',85:'Trumpas sniegas',86:'Smarkus sniegas',
95:'Perkūnija',96:'Perkūnija su kruša',99:'Perkūnija su kruša'};

function kind(c){
  if(c===0)return'clear';if(c<=2)return'part';if(c===3)return'cloud';if(c<=48)return'fog';
  if((c>=71&&c<=77)||c===85||c===86)return'snow';if(c>=95)return'storm';return'rain';
}
const SUN='<g class="rays" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"><path d="M32 6v6M32 52v6M6 32h6M52 32h6M13.6 13.6l4.2 4.2M46.2 46.2l4.2 4.2M13.6 50.4l4.2-4.2M46.2 17.8l4.2-4.2"/></g><circle cx="32" cy="32" r="11" fill="#fbbf24"/>';
const MOON='<path d="M40 14a18 18 0 1 0 10 28A15 15 0 0 1 40 14z" fill="#cbd5e1"/>';
const CLOUD=(f,x=0,y=0)=>`<g class="cl" transform="translate(${x} ${y})"><path d="M20 50h26a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 20 50z" fill="${f}" stroke="#94a3b8" stroke-width="1.5"/></g>`;
function svg(c,day){
  const k=kind(c);let s='';
  if(k==='clear')s=day?SUN:MOON;
  else if(k==='part')s=`<g transform="translate(-8 -8) scale(.8)">${day?SUN:MOON}</g>`+CLOUD('#fff',4,6);
  else if(k==='cloud')s=CLOUD('#e2e8f0',-6,-6)+CLOUD('#fff',4,2);
  else if(k==='fog')s=CLOUD('#f1f5f9',0,-6)+'<g stroke="#94a3b8" stroke-width="3" stroke-linecap="round"><path d="M14 52h36M20 58h28"/></g>';
  else if(k==='rain')s=CLOUD('#fff',0,-6)+'<g stroke="#3b82f6" stroke-width="3" stroke-linecap="round"><path class="dr" d="M24 50l-2 6"/><path class="dr" d="M33 50l-2 6"/><path class="dr" d="M42 50l-2 6"/></g>';
  else if(k==='snow')s=CLOUD('#fff',0,-6)+'<g fill="#60a5fa"><circle class="dr" cx="24" cy="54" r="2.4"/><circle class="dr" cx="33" cy="54" r="2.4"/><circle class="dr" cx="42" cy="54" r="2.4"/></g>';
  else s=CLOUD('#cbd5e1',0,-6)+'<path class="bolt" d="M34 44l-8 12h7l-3 8 10-13h-7l4-7z" fill="#f59e0b"/>';
  return `<svg viewBox="0 0 64 64">${s}</svg>`;
}
async function load(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,is_day,wind_speed_10m,precipitation&hourly=weather_code,temperature_2m,is_day&forecast_hours=12&wind_speed_unit=ms&timezone=Europe%2FVilnius`;
    const d=await (await fetch(u)).json();const c=d.current;
    document.getElementById('ic').innerHTML=svg(c.weather_code,c.is_day);
    document.getElementById('ic').title=TXT[c.weather_code]||'';
    document.getElementById('t').textContent=TXT[c.weather_code]||'—';
    document.getElementById('s').textContent=`Lauke ${Math.round(c.temperature_2m)}° · vėjas ${c.wind_speed_10m.toFixed(1)} m/s`+(c.precipitation>0?` · ${c.precipitation} mm`:'');
    let h='';for(let i=3;i<=9;i+=3){const t=d.hourly.time[i];if(!t)break;
      h+=`<div>${t.slice(11,13)} h${svg(d.hourly.weather_code[i],d.hourly.is_day[i])}${Math.round(d.hourly.temperature_2m[i])}°</div>`}
    document.getElementById('h').innerHTML=h;
  }catch(e){document.getElementById('t').textContent='Nėra ryšio';}
}
load();setInterval(load,15*60*1000);
</script>
</body>
</html>
